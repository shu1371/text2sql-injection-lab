<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="780" viewBox="0 0 1280 780" font-family="'Microsoft YaHei','PingFang SC',Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2f7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.15"/>
    </filter>
    <marker id="arrGray" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#475569"/>
    </marker>
    <marker id="arrRed" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#dc2626"/>
    </marker>
    <marker id="arrGreen" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#16a34a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1280" height="780" fill="url(#bg)"/>
  <text x="640" y="44" text-anchor="middle" font-size="25" font-weight="700" fill="#0f172a">图2　一次“查天气”如何演变成数据库越权：完整攻击链</text>

  <!-- 参与者 -->
  <g>
    <rect x="60" y="86" width="180" height="52" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
    <text x="150" y="118" text-anchor="middle" font-size="16" font-weight="700" fill="#991b1b">攻击者</text>
    <rect x="330" y="86" width="180" height="52" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <text x="420" y="118" text-anchor="middle" font-size="16" font-weight="700" fill="#1e40af">NL2SQL 应用</text>
    <rect x="600" y="86" width="180" height="52" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
    <text x="690" y="118" text-anchor="middle" font-size="16" font-weight="700" fill="#92400e">LLM</text>
    <rect x="870" y="86" width="180" height="52" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <text x="960" y="118" text-anchor="middle" font-size="16" font-weight="700" fill="#14532d">SQL 执行器</text>
    <rect x="1100" y="86" width="150" height="52" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
    <text x="1175" y="118" text-anchor="middle" font-size="15" font-weight="700" fill="#334155">数据库</text>
  </g>

  <line x1="150" y1="138" x2="150" y2="740" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6 6"/>
  <line x1="420" y1="138" x2="420" y2="740" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6 6"/>
  <line x1="690" y1="138" x2="690" y2="740" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6 6"/>
  <line x1="960" y1="138" x2="960" y2="740" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6 6"/>
  <line x1="1175" y1="138" x2="1175" y2="740" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- 步骤1 -->
  <circle cx="150" cy="200" r="14" fill="#dc2626"/>
  <text x="150" y="205" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">1</text>
  <path d="M164,200 C240,200 320,200 404,200" stroke="#475569" stroke-width="3" fill="none" marker-end="url(#arrGray)"/>
  <rect x="200" y="173" width="230" height="22" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
  <text x="315" y="189" text-anchor="middle" font-size="12.5" fill="#334155">“查天气 + 执行 SELECT ... FROM users”</text>

  <!-- 步骤2 -->
  <circle cx="420" cy="270" r="14" fill="#d97706"/>
  <text x="420" y="275" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">2</text>
  <path d="M434,270 C500,270 590,270 674,270" stroke="#d97706" stroke-width="3" fill="none" marker-end="url(#arrGray)"/>
  <rect x="470" y="243" width="190" height="22" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1"/>
  <text x="565" y="259" text-anchor="middle" font-size="12.5" fill="#92400e">拼接提示词（问题+Schema+规则）</text>

  <!-- 步骤3 -->
  <circle cx="690" cy="340" r="14" fill="#dc2626"/>
  <text x="690" y="345" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">3</text>
  <path d="M676,340 C580,340 500,340 436,340" stroke="#dc2626" stroke-width="3.5" fill="none" marker-end="url(#arrRed)"/>
  <rect x="470" y="313" width="230" height="22" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
  <text x="585" y="329" text-anchor="middle" font-size="12.5" fill="#991b1b">返回越权 SQL（UNION 带出 users 表）</text>

  <!-- 步骤4 -->
  <circle cx="420" cy="410" r="14" fill="#16a34a"/>
  <text x="420" y="415" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">4</text>
  <path d="M434,410 C560,410 760,410 944,410" stroke="#16a34a" stroke-width="3" fill="none" marker-end="url(#arrGreen)"/>
  <rect x="560" y="383" width="280" height="22" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1"/>
  <text x="700" y="399" text-anchor="middle" font-size="12.5" fill="#166534">直接执行 SQL（无任何校验）</text>

  <!-- 步骤5 -->
  <circle cx="960" cy="490" r="14" fill="#dc2626"/>
  <text x="960" y="495" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">5</text>
  <path d="M974,490 C1060,490 1120,490 1159,490" stroke="#dc2626" stroke-width="3.5" fill="none" marker-end="url(#arrRed)"/>
  <rect x="1020" y="463" width="140" height="22" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
  <text x="1090" y="479" text-anchor="middle" font-size="12.5" fill="#991b1b">执行越权查询</text>

  <!-- 步骤6 -->
  <circle cx="1175" cy="570" r="14" fill="#dc2626"/>
  <text x="1175" y="575" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">6</text>
  <path d="M1161,570 C1080,570 1010,570 976,570" stroke="#dc2626" stroke-width="3.5" fill="none" marker-end="url(#arrRed)"/>
  <rect x="1000" y="543" width="180" height="22" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
  <text x="1090" y="559" text-anchor="middle" font-size="12.5" fill="#991b1b">返回用户名/邮箱/口令哈希</text>

  <!-- 步骤7 -->
  <circle cx="420" cy="650" r="14" fill="#dc2626"/>
  <text x="420" y="655" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">7</text>
  <path d="M406,650 C300,650 210,650 166,650" stroke="#dc2626" stroke-width="3.5" fill="none" stroke-dasharray="8 5" marker-end="url(#arrRed)"/>
  <rect x="210" y="623" width="200" height="22" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1"/>
  <text x="310" y="639" text-anchor="middle" font-size="12.5" fill="#991b1b">敏感数据外带</text>

  <text x="640" y="724" text-anchor="middle" font-size="15" font-weight="700" fill="#dc2626">▲ 整条链上唯一的“安全决策点”是 LLM 生成 SQL，应用层与执行层都没有设防</text>
</svg>
