<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="780" viewBox="0 0 1280 780" font-family="'Microsoft YaHei','PingFang SC',Arial,sans-serif">
  <defs>
    <linearGradient id="gRed" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ef4444"/><stop offset="1" stop-color="#dc2626"/></linearGradient>
    <linearGradient id="gDark" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b91c1c"/><stop offset="1" stop-color="#991b1b"/></linearGradient>
    <linearGradient id="gAmber" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbbf24"/><stop offset="1" stop-color="#f59e0b"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.15"/></filter>
  </defs>
  <rect x="0" y="0" width="1280" height="780" fill="#f8fafc"/>
  <text x="640" y="50" text-anchor="middle" font-size="25" font-weight="700" fill="#0f172a">图4　Text-to-SQL 注入攻击与防御对比实验（每场景 8 轮，模型 qwen2.5:7b）</text>
  <line x1="130" y1="630.0" x2="1170" y2="630.0" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="118" y="635.0" text-anchor="end" font-size="14" fill="#64748b">0</text>
  <line x1="130" y1="573.1" x2="1170" y2="573.1" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="118" y="578.1" text-anchor="end" font-size="14" fill="#64748b">1</text>
  <line x1="130" y1="516.2" x2="1170" y2="516.2" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="118" y="521.2" text-anchor="end" font-size="14" fill="#64748b">2</text>
  <line x1="130" y1="459.4" x2="1170" y2="459.4" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="118" y="464.4" text-anchor="end" font-size="14" fill="#64748b">3</text>
