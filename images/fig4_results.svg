  <text x="118" y="407.5" text-anchor="end" font-size="14" fill="#64748b">4</text>
  <line x1="130" y1="345.6" x2="1170" y2="345.6" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="118" y="350.6" text-anchor="end" font-size="14" fill="#64748b">5</text>
  <line x1="130" y1="288.8" x2="1170" y2="288.8" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="118" y="293.8" text-anchor="end" font-size="14" fill="#64748b">6</text>
  <line x1="130" y1="231.9" x2="1170" y2="231.9" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="118" y="236.9" text-anchor="end" font-size="14" fill="#64748b">7</text>
  <line x1="130" y1="175.0" x2="1170" y2="175.0" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="118" y="180.0" text-anchor="end" font-size="14" fill="#64748b">8</text>
  <text x="52" y="402" text-anchor="middle" font-size="14" fill="#475569" transform="rotate(-90 52 402)">次数 / 8 轮</text>
  <text x="234.0" y="660" text-anchor="middle" font-size="14.5" font-weight="600" fill="#334155">基线</text>
  <text x="234.0" y="682" text-anchor="middle" font-size="14.5" font-weight="600" fill="#334155">（正常问题）</text>
  <rect x="373.0" y="231.9" width="40" height="398.1" rx="6" fill="url(#gRed)" filter="url(#shadow)"/>
  <text x="393.0" y="223.9" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f172a">7</text>
  <rect x="419.0" y="345.6" width="40" height="284.4" rx="6" fill="url(#gDark)" filter="url(#shadow)"/>
  <text x="439.0" y="337.6" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f172a">5</text>
  <text x="442.0" y="660" text-anchor="middle" font-size="14.5" font-weight="600" fill="#334155">直接注入</text>
  <text x="442.0" y="682" text-anchor="middle" font-size="14.5" font-weight="600" fill="#334155">（恶意问题）</text>
  <rect x="581.0" y="175.0" width="40" height="455.0" rx="6" fill="url(#gRed)" filter="url(#shadow)"/>
  <text x="601.0" y="167.0" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f172a">8</text>
  <rect x="627.0" y="459.4" width="40" height="170.6" rx="6" fill="url(#gDark)" filter="url(#shadow)"/>
  <text x="647.0" y="451.4" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f172a">3</text>
  <text x="650.0" y="660" text-anchor="middle" font-size="14.5" font-weight="600" fill="#334155">数据投毒</text>
  <text x="650.0" y="682" text-anchor="middle" font-size="14.5" font-weight="600" fill="#334155">（规则+正常问题）</text>
  <rect x="789.0" y="516.2" width="40" height="113.8" rx="6" fill="url(#gRed)" filter="url(#shadow)"/>
  <text x="809.0" y="508.2" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f172a">2</text>
  <rect x="835.0" y="573.1" width="40" height="56.9" rx="6" fill="url(#gDark)" filter="url(#shadow)"/>
  <text x="855.0" y="565.1" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f172a">1</text>
  <text x="858.0" y="660" text-anchor="middle" font-size="14.5" font-weight="600" fill="#334155">语义层防御</text>
  <rect x="997.0" y="231.9" width="40" height="398.1" rx="6" fill="url(#gRed)" filter="url(#shadow)"/>
  <text x="1017.0" y="223.9" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f172a">7</text>
  <rect x="1089.0" y="231.9" width="40" height="398.1" rx="6" fill="url(#gAmber)" filter="url(#shadow)"/>
  <text x="1109.0" y="223.9" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0f172a">7</text>
  <text x="1066.0" y="660" text-anchor="middle" font-size="14.5" font-weight="600" fill="#334155">执行层防御</text>
  <text x="1066.0" y="682" text-anchor="middle" font-size="14.5" font-weight="600" fill="#334155">（SQL 校验器）</text>
  <line x1="130" y1="630" x2="1170" y2="630" stroke="#94a3b8" stroke-width="2"/>
  <rect x="380" y="118" width="24" height="16" rx="4" fill="url(#gRed)"/>
  <text x="412" y="131" font-size="14" fill="#334155">生成 SQL 涉及 users 表</text>
  <rect x="680" y="118" width="24" height="16" rx="4" fill="url(#gDark)"/>
  <text x="712" y="131" font-size="14" fill="#334155">越权查询实际执行</text>
  <rect x="980" y="118" width="24" height="16" rx="4" fill="url(#gAmber)"/>
  <text x="1012" y="131" font-size="14" fill="#334155">被校验器拦截</text>
</svg>